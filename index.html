<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ジグソーパズル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ タイトル画面 ============ -->
  <div id="screen-title" class="screen">
    <div class="title-wrap">
      <h1 class="logo">🧩 ジグソーパズル</h1>
      <p class="tagline">すきな画像でパズルにちょうせん！</p>

      <button id="btn-start" class="btn btn-primary btn-lg">はじめる</button>
      <button id="btn-open-upload" class="btn btn-secondary">画像を追加</button>
      <button id="btn-open-settings" class="btn btn-ghost">⚙️ 設定</button>

      <div class="best-times-box">
        <div class="best-times-title">ベストタイム</div>
        <div class="best-times-list" id="best-times-list">
          <!-- JSで生成 -->
        </div>
      </div>
    </div>
  </div>

  <!-- ============ レベル選択画面 ============ -->
  <div id="screen-level" class="screen hidden">
    <div class="panel">
      <h2 class="panel-title">レベルをえらんでね</h2>

      <div class="level-grid" id="level-grid">
        <!-- JSで生成 -->
      </div>

      <div class="mode-buttons">
        <button id="btn-play-random" class="btn btn-primary btn-lg">🎲 ランダムであそぶ</button>
        <button id="btn-play-choose" class="btn btn-secondary">🖼️ 画像をえらんであそぶ</button>
      </div>

      <button id="btn-level-back" class="btn btn-ghost">タイトルへもどる</button>
    </div>
  </div>

  <!-- ============ 画像選択画面 ============ -->
  <div id="screen-imageselect" class="screen hidden">
    <div class="panel panel-wide">
      <h2 class="panel-title">画像をえらんでね</h2>
      <div class="image-grid" id="image-select-grid">
        <!-- JSで生成 -->
      </div>
      <button id="btn-imageselect-back" class="btn btn-ghost">レベル選択へもどる</button>
    </div>
  </div>

  <!-- ============ ゲーム画面 ============ -->
  <div id="screen-game" class="screen hidden screen-game">
    <div id="game-topbar">
      <div id="game-level-tag">EASY</div>
      <div id="game-timer">00:00</div>
      <button id="btn-pause" class="icon-btn" aria-label="ポーズ">⏸</button>
    </div>

    <div id="game-stage">
      <canvas id="game-canvas"></canvas>
      <button id="guide-thumbnail" class="guide-thumbnail hidden" aria-label="完成図を拡大">
        <img id="guide-thumbnail-image" alt="完成図">
      </button>
    </div>
  </div>

  <!-- ============ クリア画面 ============ -->
  <div id="screen-clear" class="screen hidden">
    <div class="panel">
      <h2 class="panel-title clear-title">🎉 かんせい！</h2>
      <div class="clear-time" id="clear-time">00:00</div>
      <div class="clear-best" id="clear-best-tag"></div>

      <button id="btn-clear-retry" class="btn btn-primary btn-lg">もう一度</button>
      <button id="btn-clear-title" class="btn btn-secondary">タイトルへ</button>
    </div>
  </div>

  <!-- ============ ポーズオーバーレイ ============ -->
  <div id="modal-pause" class="modal hidden">
    <div class="modal-card">
      <h2 class="modal-title">ポーズ中</h2>
      <button id="btn-resume" class="btn btn-primary btn-lg">つづける</button>
      <button id="btn-pause-title" class="btn btn-secondary">タイトルへもどる</button>
    </div>
  </div>

  <!-- ============ 完成図プレビューモーダル ============ -->
  <div id="modal-guide-preview" class="modal hidden">
    <div class="guide-preview-card">
      <img id="guide-preview-image" alt="完成図">
      <button id="btn-guide-preview-close" class="btn btn-secondary">とじる</button>
    </div>
  </div>

  <!-- ============ 設定モーダル ============ -->
  <div id="modal-settings" class="modal hidden">
    <div class="modal-card settings-card">
      <h2 class="modal-title">⚙️ 設定</h2>
      <div class="settings-section">
        <div class="settings-label">ガイド</div>
        <button id="setting-guide-picture" class="setting-toggle" type="button"><span>ガイドピクチャー</span><strong>ON</strong></button>
        <button id="setting-guide-line" class="setting-toggle" type="button"><span>ガイドライン</span><strong>ON</strong></button>
      </div>
      <div class="settings-section">
        <div class="settings-label">サンプル画像</div>
        <button id="btn-reset-samples" class="btn btn-secondary">サンプル画像を初期状態に戻す</button>
      </div>
      <button id="btn-settings-close" class="btn btn-ghost">とじる</button>
    </div>
  </div>

  <!-- ============ 画像追加：モード選択モーダル ============ -->
  <div id="modal-upload-menu" class="modal hidden">
    <div class="modal-card">
      <h2 class="modal-title">画像を追加</h2>
      <button id="btn-upload-new" class="btn btn-primary">📷 新規追加</button>
      <button id="btn-upload-list" class="btn btn-secondary">🗂️ 追加済み確認</button>
      <button id="btn-upload-menu-close" class="btn btn-ghost">とじる</button>
    </div>
  </div>

  <!-- ============ 追加済み画像一覧モーダル ============ -->
  <div id="modal-upload-list" class="modal hidden">
    <div class="modal-card modal-card-wide">
      <h2 class="modal-title">追加済みの画像</h2>
      <div class="uploaded-grid" id="uploaded-grid">
        <!-- JSで生成 -->
      </div>
      <div class="uploaded-empty hidden" id="uploaded-empty">まだ画像がありません</div>
      <button id="btn-uploaded-close" class="btn btn-ghost">とじる</button>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" hidden>

</div>

<script src="script.js"></script>
</body>
</html>
